name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Ensure debug keystore exists
      run: |
        if [ ! -f debug.keystore ]; then
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
        fi
        
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Build debug APK with Gradle
      run: ./gradlew assembleDebug --no-daemon
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-Mobile-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
    - name: Create Pre-release for Phone Download
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly-dev
        name: Development Build (Nightly)
        body: |
          Automated build from the latest code.
          Download the APK below and install it directly on your Android phone.
        prerelease: true
        files: app/build/outputs/apk/debug/app-debug.apk

